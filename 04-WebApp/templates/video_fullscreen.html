{% extends "base.html" %}

{% block title %}Live Stream - Multimodal Emotion Recognition{% endblock %}

{% block extra_css %}
<style>
    .stream-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }
    .stream-wrapper {
        width: 100%;
        max-width: 900px;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 16px;
        overflow: hidden;
        border: 2px solid var(--border-glass);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        position: relative;
    }
    .stream-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>
{% endblock %}

{% block content %}
<div class="stream-container">
    <div style="text-align: center; margin-bottom: 0.5rem;">
        <h1 style="font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700;">Continuous Live Stream Feed</h1>
        <p style="color: var(--text-muted);">Real-time OpenCV Face & Emotion Detection Stream</p>
    </div>

    <div class="glass-card stream-wrapper">
        <img src="{{ url_for('video_feed') }}" class="stream-img" alt="Live Video Feed" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'640\' height=\'360\'><rect width=\'100%\' height=\'100%\' fill=\'%230f172a\'/><text x=\'50%\' y=\'50%\' fill=\'%2394a3b8\' font-family=\'sans-serif\' font-size=\'20\' text-anchor=\'middle\'>Camera Feed Unavailable</text></svg>';">
    </div>

    <div style="display: flex; gap: 1rem;">
        <a href="{{ url_for('live_test') }}" class="btn btn-primary">
            <i class="fa-solid fa-camera"></i> Switch to Live Recorder
        </a>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">
            <i class="fa-solid fa-house"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
